name: Main
run-name: ${{ github.actor }} is building the project.

on:
  pull_request:

jobs:
  analyze:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create env files
        run: |
          cat <<EOF > .env.dev
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          EOF
          cat <<EOF > .env.prod
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          EOF

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter test
        run: flutter test

      - name: CodeRabbit review
        # Assumes CodeRabbit CLI is available on the runner PATH
        # and CODERABBIT_API_KEY is configured as a repository secret.
        env:
          CODERABBIT_API_KEY: ${{ secrets.CODERABBIT_API_KEY }}
        run: |
          coderabbit analyze > coderabbit_report.json
          if grep -q '"severity": "critical"' coderabbit_report.json; then
            echo "Critical issues found by CodeRabbit. Stopping pipeline."
            exit 1
          fi

  web-build:
    runs-on: ubuntu-latest
    needs:
      - analyze
    environment: production
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create env files
        run: |
          cat <<EOF > .env.dev
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          EOF
          cat <<EOF > .env.prod
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          EOF

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Flutter web build
        run: flutter build web
